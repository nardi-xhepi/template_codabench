version: 2
title: FLIP AAV Capsid Optimization Challenge
description: Predict protein fitness from amino acid sequences
image: logo.png
registration_auto_approve: True  # if True, do not require approval from admin to join the comp

terms: pages/terms.md
pages:
  - title: Participation
    file: pages/participate.md
  - title: Seed
    file: pages/seed.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Developement Task
    description: 'Train on low-mutation variants (1-2), test on high-mutation variants (3+)'
    input_data: dev_phase/input_data/
    reference_data: dev_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
    - 0
    path: solution/


phases:
  - name: Development Phase
    description: 'Development phase: tune your models. Only public test scores are visible on the leaderboard. Private test scores are computed but hidden.'
    start: 2026-03-08
    end: 2026-05-31
    max_submissions_per_day: 30
    max_submissions: 200
    tasks:
      - 0
  - name: Final Phase
    description: 'Final phase: submit your best model. Private test scores will be revealed for final ranking.'
    start: 2026-06-01
    end: 2032-03-07
    max_submissions_per_day: 3
    max_submissions: 10
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      - title: Test Spearman Correlation
        key: test
        index: 0
        sorting: desc
      - title: Test Precision@100
        key: test_precision100
        index: 1
        sorting: desc
      - title: Private Test Spearman
        key: private_test
        index: 2
        sorting: desc
        hidden: True
      - title: Private Test Precision@100
        key: private_test_precision100
        index: 3
        sorting: desc
        hidden: True
      - title: Train time
        key: train_time
        index: 4
        sorting: asc
      - title: Test time
        key: test_time
        index: 5
        sorting: asc
